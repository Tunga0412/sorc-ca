name: SORCShortages monthly update
on:
  push:
    branches: [main]
    paths:
      - 'sorcshortages/**'
      - 'automation/shortages_monthly.py'
      - 'tests/test_shortages.py'
      - '.github/workflows/sorc-shortages-update.yml'
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sorc-publisher
  cancel-in-progress: false
jobs:
  update-shortages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SORCSHORTAGES_API_EMAIL: ${{ secrets.SORCSHORTAGES_API_EMAIL }}
      SORCSHORTAGES_API_PASSWORD: ${{ secrets.SORCSHORTAGES_API_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
      - run: python -m pip install -r sorcshortages/requirements.txt
      - name: Source/date regression and failed-publication checks
        run: python -B tests/test_shortages.py
      - name: Build and audit the complete source candidate
        run: |
          if python -B -m automation.shortages_monthly --source api; then
            echo 'Complete API source and independent audit succeeded'
          else
            echo 'API source unavailable; trying the public export without replacing the accepted publication'
            python -B -m automation.shortages_monthly --source public-export
          fi
      - name: Verify written JSON, JavaScript, CSV and retained source
        run: |
          python -B - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,'automation')
          from pages_gate import validate_shortages
          print(json.dumps(validate_shortages(Path('.')),sort_keys=True))
          PY
      - name: Publish only accepted Shortages data and provenance
        run: |
          git config user.name 'SORC automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add data/consolidated.json data/consolidated.js data/records.csv data/source-audit.json data/snapshots
            # CSV preserves source whitespace and standard CRLF records; validate its
            # values with validate_shortages above, rather than code style rules.
            git diff --cached --check -- data/consolidated.json data/consolidated.js data/source-audit.json
            if git diff --cached --quiet; then
              echo 'Another run already published this accepted snapshot'
              exit 0
            fi
            git commit -m 'Publish source-audited SORCShortages snapshot and research downloads'
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git fetch origin main
              git reset --hard origin/main
              python -m pip install -r sorcshortages/requirements.txt
              if python -B -m automation.shortages_monthly --source api; then
                echo 'API refresh succeeded after main changed'
              else
                python -B -m automation.shortages_monthly --source public-export
              fi
              python -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'automation')
          from pages_gate import validate_shortages
          validate_shortages(Path('.'))
          PY
            fi
          done
          exit 1
