name: SORCShortages monthly update

on:
  push:
    paths:
      - "sorcshortages/**"
      - "automation/shortages_monthly.py"
      - "automation/requirements.lock.txt"
      - ".github/workflows/sorc-shortages-update.yml"
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sorc-publisher
  cancel-in-progress: false

jobs:
  update-shortages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current public site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/requirements.lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r automation/requirements.lock.txt

      - name: Build and validate Shortages candidate
        run: python automation/shortages_monthly.py

      - name: Validate published files
        run: |
          python -m json.tool data/consolidated.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path("data/consolidated.js").read_text(encoding="utf-8")
          assert text.startswith("window.SORC_DATA = ")
          payload = json.loads(text[len("window.SORC_DATA = "):].rstrip().rstrip(";"))
          assert payload["records"]
          assert payload["summary"]["shortages"] > 0
          assert payload["summary"]["discontinuations"] > 0
          print(f"Validated {len(payload['records'])} reports from snapshot {payload['latest_snapshot']}")
          PY

      - name: Publish accepted Shortages dataset
        run: |
          git config user.name "SORC automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/consolidated.json data/consolidated.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Shortages dataset is unchanged"
            exit 0
          fi
          git commit -m "Automated SORCShortages monthly update"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push was not fast-forwardable. Rebasing on the latest main and retrying."
              git pull --rebase origin main
            fi
          done
          exit 1
