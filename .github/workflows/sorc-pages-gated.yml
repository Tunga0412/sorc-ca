name: Validated SORC Pages deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate and package without deployment
        type: boolean
        default: true
      check_legacy:
        description: Also prove the known older renderer is rejected
        type: boolean
        default: false

permissions:
  contents: read

env:
  SORC_PAGES_GATE_ARMED: 'false'

concurrency:
  group: sorc-pages-validated
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - name: Check out this exact public commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
      - name: Validate public exports and package unchanged website assets
        run: python automation/pages_gate.py --source . --output "$RUNNER_TEMP/validated-site"
      - name: Prove the known older renderer cannot pass the gate
        if: github.event_name == 'workflow_dispatch' && inputs.check_legacy
        run: |
          python - <<'PY'
          import hashlib,sys,urllib.request
          sys.path.insert(0,'automation')
          from pages_gate import validate_live
          url='https://raw.githubusercontent.com/Tunga0412/sorc-ca/f8af846987a9d84fa70302908523c43c1251df2e/sorctracks_live.html'
          with urllib.request.urlopen(url,timeout=30)as response:
              raw=response.read(8*1024*1024+1)
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='8d6e061169a070d3596ed4bda9044b0be8f009f0'
          try:
              validate_live(raw)
          except ValueError:
              print('PASS: immutable known legacy renderer rejected; no deployment requested')
          else:
              raise SystemExit('Legacy renderer unexpectedly passed')
          PY
      - name: Select deployment mode
        id: mode
        env:
          VALIDATE_ONLY: ${{ inputs.validate_only }}
          CHECK_LEGACY: ${{ inputs.check_legacy }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          deploy=os.environ['SORC_PAGES_GATE_ARMED']=='true'
          if os.environ['EVENT_NAME']=='workflow_dispatch':
              deploy=deploy and os.environ['VALIDATE_ONLY']!='true' and os.environ['CHECK_LEGACY']!='true'
          with open(os.environ['GITHUB_OUTPUT'],'a')as output:
              output.write('deploy='+str(deploy).lower()+'\n')
          PY
      - name: Upload only validated static content
        if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/validated-site
          retention-days: 1

  deploy-validated-site:
    name: deploy-validated-site
    if: needs.build.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated public site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
