name: SORC public health check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public tools
        env:
          HISTORICAL_URL: https://sorc.ca/sorctracks_tool.html
          LIVE_URL: https://sorc.ca/sorctracks_live.html
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import sys
          import urllib.request

          HISTORICAL_URL = "https://sorc.ca/sorctracks_tool.html"
          LIVE_URL = "https://sorc.ca/sorctracks_live.html"
          MAX_LIVE_AGE_HOURS = 48
          failures = []

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "SORC public health check/1.0"},
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return response.status, response.read().decode("utf-8")

          def constant(html, name):
              marker = f"const {name} = "
              start = html.find(marker)
              if start < 0:
                  raise ValueError(f"missing JavaScript constant {name}")
              decoder = json.JSONDecoder()
              return decoder.raw_decode(html[start + len(marker):])[0]

          def common(label, status, html):
              if status != 200:
                  failures.append(f"{label} returned HTTP {status}")
              if len(html) < 1000:
                  failures.append(f"{label} is unexpectedly small")
              lowered = html.lower()
              for marker in ("api key required", "error loading map", "uncaught typeerror"):
                  if marker in lowered:
                      failures.append(f"{label} contains failure marker: {marker}")

          try:
              status, html = fetch(HISTORICAL_URL)
              common("Historical page", status, html)
              data = constant(html, "DATA")
              if not isinstance(data, dict) or not data.get("sites"):
                  failures.append("Historical DATA has no sites")
          except Exception as exc:
              failures.append(f"Historical check failed: {exc}")

          try:
              status, html = fetch(LIVE_URL)
              common("Live page", status, html)
              data = constant(html, "LIVE_DATA")
              if not isinstance(data, dict):
                  failures.append("Live LIVE_DATA is not an object")
              else:
                  if data.get("demo_fixture"):
                      failures.append("Live page is using fixture data")
                  generated_at = data.get("generated_at")
                  if not generated_at:
                      failures.append("Live page has no generated_at timestamp")
                  else:
                      timestamp = dt.datetime.fromisoformat(str(generated_at).replace("Z", "+00:00"))
                      if timestamp.tzinfo is None:
                          timestamp = timestamp.replace(tzinfo=dt.timezone.utc)
                      age_hours = (dt.datetime.now(dt.timezone.utc) - timestamp.astimezone(dt.timezone.utc)).total_seconds() / 3600
                      if age_hours < -1:
                          failures.append("Live generated_at is in the future")
                      elif age_hours > MAX_LIVE_AGE_HOURS:
                          failures.append(f"Live page is {age_hours:.1f} hours old")
              if "tile.openstreetmap.org" not in html:
                  failures.append("Live page is missing the configured map tile provider")
          except Exception as exc:
              failures.append(f"Live check failed: {exc}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          print("SORC public health check passed")
          PY
