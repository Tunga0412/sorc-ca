name: SORC public health check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public tools
        id: public-health
        continue-on-error: true
        env:
          HISTORICAL_URL: https://sorc.ca/sorctracks_tool.html
          LIVE_URL: https://sorc.ca/sorctracks_live.html
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee health-check.log
          import datetime as dt
          import json
          import sys
          import urllib.request

          HISTORICAL_URL = "https://sorc.ca/sorctracks_tool.html"
          LIVE_URL = "https://sorc.ca/sorctracks_live.html"
          SHORTAGES_URL = "https://sorc.ca/sorcshortages_tool.html"
          SHORTAGES_DATA_URL = "https://sorc.ca/data/consolidated.js"
          MAX_LIVE_AGE_HOURS = 48
          MAX_SHORTAGES_AGE_DAYS = 45
          failures = []

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "SORC public health check/1.0"},
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return response.status, response.read().decode("utf-8")

          def constant(html, name):
              marker = f"const {name} = "
              start = html.find(marker)
              if start < 0:
                  raise ValueError(f"missing JavaScript constant {name}")
              decoder = json.JSONDecoder()
              return decoder.raw_decode(html[start + len(marker):])[0]

          def common(label, status, html):
              if status != 200:
                  failures.append(f"{label} returned HTTP {status}")
              if len(html) < 1000:
                  failures.append(f"{label} is unexpectedly small")
              lowered = html.lower()
              for marker in (
                  "api key required",
                  "error loading map",
                  "uncaught typeerror",
                  "mapbox",
                  "tiles.stadiamaps.com",
                  "api_key=",
                  "apikey=",
                  "access_token=",
              ):
                  if marker in lowered:
                      failures.append(f"{label} contains failure marker: {marker}")

          try:
              status, html = fetch(HISTORICAL_URL)
              common("Historical page", status, html)
              data = constant(html, "DATA")
              if not isinstance(data, dict) or not data.get("sites"):
                  failures.append("Historical DATA has no sites")
          except Exception as exc:
              failures.append(f"Historical check failed: {exc}")

          try:
              status, html = fetch(SHORTAGES_URL)
              common("SORCShortages page", status, html)
              if "data/consolidated.js" not in html:
                  failures.append("SORCShortages page does not reference its bundled data")
              data_status, data_source = fetch(SHORTAGES_DATA_URL)
              common("SORCShortages data", data_status, data_source)
              marker = "window.SORC_DATA = "
              start = data_source.find(marker)
              if start < 0:
                  raise ValueError("missing window.SORC_DATA")
              decoder = json.JSONDecoder()
              data = decoder.raw_decode(data_source[start + len(marker):])[0]
              if not isinstance(data, dict) or not data.get("records"):
                  failures.append("SORCShortages data has no records")
              else:
                  if not data.get("latest_snapshot"):
                      failures.append("SORCShortages data has no latest_snapshot")
                  generated_at = data.get("generated_at")
                  if not generated_at:
                      failures.append("SORCShortages data has no generated_at timestamp")
                  else:
                      timestamp = dt.datetime.fromisoformat(str(generated_at).replace("Z", "+00:00"))
                      if timestamp.tzinfo is None:
                          timestamp = timestamp.replace(tzinfo=dt.timezone.utc)
                      age_days = (dt.datetime.now(dt.timezone.utc) - timestamp.astimezone(dt.timezone.utc)).total_seconds() / 86400
                      if age_days > MAX_SHORTAGES_AGE_DAYS:
                          failures.append(f"SORCShortages data is {age_days:.1f} days old")
          except Exception as exc:
              failures.append(f"SORCShortages check failed: {exc}")

          try:
              status, html = fetch(LIVE_URL)
              common("Live page", status, html)
              data = constant(html, "LIVE_DATA")
              if not isinstance(data, dict):
                  failures.append("Live LIVE_DATA is not an object")
              else:
                  if data.get("demo_fixture"):
                      failures.append("Live page is using fixture data")
                  generated_at = data.get("generated_at")
                  if not generated_at:
                      failures.append("Live page has no generated_at timestamp")
                  else:
                      timestamp = dt.datetime.fromisoformat(str(generated_at).replace("Z", "+00:00"))
                      if timestamp.tzinfo is None:
                          timestamp = timestamp.replace(tzinfo=dt.timezone.utc)
                      age_hours = (dt.datetime.now(dt.timezone.utc) - timestamp.astimezone(dt.timezone.utc)).total_seconds() / 3600
                      if age_hours < -1:
                          failures.append("Live generated_at is in the future")
                      elif age_hours > MAX_LIVE_AGE_HOURS:
                          failures.append(f"Live page is {age_hours:.1f} hours old")
              if not any(marker in html for marker in ("basemaps.cartocdn.com", "tile.openstreetmap.org")):
                  failures.append("Live page is missing a supported map tile provider")
              for marker in ("tile.openstreetmap.org", "basemaps.cartocdn.com", "backupTiles", "tileerror"):
                  if marker not in html:
                      failures.append(f"Live page is missing keyless map fallback marker: {marker}")
          except Exception as exc:
              failures.append(f"Live check failed: {exc}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          print("SORC public health check passed")
          PY

      - name: Open or update failure issue
        if: steps.public-health.outcome == 'failure'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api_root = f"https://api.github.com/repos/{repo}"
          title = "SORC automation health check failure"

          def api(method, path, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "SORC public health check/1.0",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          issues = api("GET", "/issues?state=open&per_page=100")
          existing = next(
              (
                  issue
                  for issue in issues
                  if issue.get("title") == title and "pull_request" not in issue
              ),
              None,
          )
          log = Path("health-check.log").read_text(encoding="utf-8", errors="replace")[-6000:]
          body = (
              "The scheduled SORC public health check failed.\n\n"
              f"Workflow: {os.environ['GITHUB_RUN_URL']}\n\n"
              "Latest output:\n\n"
              f"{log}\n"
          )
          if existing:
              api("PATCH", f"/issues/{existing['number']}", {"body": body})
          else:
              api("POST", "/issues", {"title": title, "body": body})
          PY

      - name: Close resolved failure issue
        if: steps.public-health.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api_root = f"https://api.github.com/repos/{repo}"
          title = "SORC automation health check failure"

          def api(method, path, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "SORC public health check/1.0",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          issues = api("GET", "/issues?state=open&per_page=100")
          for issue in issues:
              if issue.get("title") == title and "pull_request" not in issue:
                  api("PATCH", f"/issues/{issue['number']}", {"state": "closed"})
          PY

      - name: Preserve health failure status
        if: steps.public-health.outcome == 'failure'
        run: exit 1
