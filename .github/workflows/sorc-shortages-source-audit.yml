name: SORCShortages release audit
on:
  pull_request:
    paths:
      - 'sorcshortages/**'
      - 'automation/shortages_monthly.py'
      - 'automation/pages_gate.py'
      - 'tests/test_shortages.py'
      - 'sorcshortages*.html'
      - 'shortages-data-guide.txt'
      - '.github/workflows/sorc-shortages*.yml'
      - '.github/workflows/sorc-pages-gated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
      - run: python -m pip install -r sorcshortages/requirements.txt
      - run: python -B tests/test_shortages.py
  full-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
      - run: python -m pip install -r sorcshortages/requirements.txt
      - name: Rebuild and audit the complete fresh source without publishing
        env:
          SORCSHORTAGES_API_EMAIL: ${{ secrets.SORCSHORTAGES_API_EMAIL }}
          SORCSHORTAGES_API_PASSWORD: ${{ secrets.SORCSHORTAGES_API_PASSWORD }}
        run: python -B -m automation.shortages_monthly --source api --output "$RUNNER_TEMP/shortages-audit/data/consolidated.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shortages-audited-source-and-output
          path: ${{ runner.temp }}/shortages-audit/
          retention-days: 90
          if-no-files-found: error
