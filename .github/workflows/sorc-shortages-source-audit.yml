name: SORCShortages full source audit
on:
  push:
    branches: [codex/sorcshortages-audit-20261116]
    paths: [.github/workflows/sorc-shortages-source-audit.yml]
permissions:
  contents: read
jobs:
  capture-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
      - run: python -m pip install beautifulsoup4==4.14.3 soupsieve==2.9.2 typing-extensions==4.16.0
      - name: Capture complete public source without publication
        env:
          SORCSHORTAGES_API_EMAIL: ${{ secrets.SORCSHORTAGES_API_EMAIL }}
          SORCSHORTAGES_API_PASSWORD: ${{ secrets.SORCSHORTAGES_API_PASSWORD }}
        run: |
          python - <<'PY'
          import os,json,gzip,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          from sorcshortages.api import ShortagesApiClient
          started=datetime.now(timezone.utc).isoformat()
          rows=ShortagesApiClient(os.environ['SORCSHORTAGES_API_EMAIL'],os.environ['SORCSHORTAGES_API_PASSWORD']).fetch_all()
          raw=json.dumps({'source_url':'https://healthproductshortages.ca/','capture_started_at':started,'capture_completed_at':datetime.now(timezone.utc).isoformat(),'reports':rows},ensure_ascii=False).encode()
          Path('source-audit').mkdir()
          Path('source-audit/raw-source.json.gz').write_bytes(gzip.compress(raw,mtime=0))
          meta={'records':len(rows),'sha256':hashlib.sha256(raw).hexdigest(),'capture_started_at':started,'source_keys':sorted(set(k for r in rows for k in r)),'representative_report':rows[0]}
          Path('source-audit/capture-summary.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in meta.items() if k!='representative_report'},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sorcshortages-original-source
          path: source-audit/
          retention-days: 90
          if-no-files-found: error
