name: SORCTracks Live update

on:
  push:
    paths:
      - "automation/live_tool.py"
      - "automation/html_patcher.py"
      - "automation/ahs_scrape_v84_patched.py"
      - "automation/health_check.py"
      - "automation/run_live_update.py"
      - "automation/requirements.txt"
      - "automation/requirements.lock.txt"
      - ".github/workflows/sorc-live-update.yml"
      - "sorctracks_tool.html"
  schedule:
    - cron: "31 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sorc-publisher
  cancel-in-progress: false

jobs:
  update-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current public site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/requirements.lock.txt

      - name: Install pinned Live dependencies
        run: python -m pip install -r automation/requirements.lock.txt

      - name: Generate Live candidate
        run: python automation/run_live_update.py

      - name: Run local candidate health checks
        run: python automation/health_check.py --historical-url "$GITHUB_WORKSPACE/sorctracks_tool.html" --live-url "$GITHUB_WORKSPACE/sorctracks_live.html" --max-live-age-hours 48 --output automation/live-health.json

      - name: Publish accepted Live page
        run: |
          git config user.name "SORC automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sorctracks_live.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Live output is unchanged"
            exit 0
          fi
          git commit -m "Automated SORCTracks Live update"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push was not fast-forwardable. Rebasing on the latest main and retrying."
              git pull --rebase origin main
            fi
          done
          exit 1

      - name: Verify deployed Live map
        env:
          LIVE_URL: https://sorc.ca/sorctracks_live.html
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "https://sorc.ca/sorctracks_live.html"
          required = (
              "tile.openstreetmap.org",
              "basemaps.cartocdn.com",
              "backupTiles",
              "tileerror",
          )
          forbidden = (
              "api key required",
              "mapbox",
              "tiles.stadiamaps.com",
              "api_key=",
              "apikey=",
              "access_token=",
          )

          for attempt in range(1, 19):
              try:
                  check_url = f"{url}?deployment_health_check={int(time.time())}"
                  request = urllib.request.Request(
                      check_url,
                      headers={"User-Agent": "SORCTracks deployment health check/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      html = response.read().decode("utf-8", errors="replace")
                  lowered = html.lower()
                  missing = [marker for marker in required if marker not in html]
                  present_forbidden = [marker for marker in forbidden if marker in lowered]
                  if response.status == 200 and not missing and not present_forbidden:
                      print("Deployed Live map passed the keyless-provider check")
                      break
                  print(
                      f"Attempt {attempt}: waiting for GitHub Pages deployment "
                      f"(missing={missing}, forbidden={present_forbidden})"
                  )
              except Exception as exc:
                  print(f"Attempt {attempt}: waiting for GitHub Pages deployment ({exc})")
              if attempt < 18:
                  time.sleep(10)
          else:
              raise SystemExit("Deployed Live page did not pass the keyless-provider check")
          PY
