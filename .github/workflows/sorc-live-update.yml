name: SORCTracks Live verification
on:
  push:
    branches: [main]
    paths:
      - "sorctracks_live.html"
      - "automation/live_tool.py"
      - "automation/live_frontend_v8.js"
      - "automation/live_source_capture.py"
      - "automation/live_timezone.py"
      - "automation/health_check.py"
      - "automation/verify_live_deployment.py"
      - ".github/workflows/sorc-live-update.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
concurrency:
  group: sorc-publisher
  cancel-in-progress: false
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the accepted public site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: automation/requirements.lock.txt
      - name: Install pinned verification dependencies
        run: python -m pip install -r automation/requirements.lock.txt
      # Collection is private. This workflow never fetches AHS or changes data.
      - name: Request the configured Pages build if needed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/request_pages_build.py
      - name: Verify the exact accepted Live bytes
        run: python automation/verify_live_deployment.py --expected sorctracks_live.html --attempts 90 --delay-seconds 10
      - name: Verify source and public-page freshness
        run: python automation/health_check.py --max-live-age-hours 48
