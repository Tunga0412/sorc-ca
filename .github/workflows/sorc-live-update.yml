name: SORCTracks Live update

on:
  push:
    branches: [main]
    paths:
      - "automation/live_tool.py"
      - "automation/public_data_reader.py"
      - "automation/current_card_guard.py"
      - "automation/live_due.py"
      - "automation/request_pages_build.py"
      - "automation/verify_live_deployment.py"
      - "automation/html_patcher.py"
      - "automation/ahs_scrape_v84_patched.py"
      - "automation/health_check.py"
      - "automation/run_live_update.py"
      - "automation/requirements.txt"
      - "automation/requirements.lock.txt"
      - ".github/workflows/sorc-live-update.yml"
  schedule:
    # Primary morning run and same-day retry; the retry skips a fresh day.
    - cron: "31 9,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sorc-publisher
  cancel-in-progress: false

jobs:
  update-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current public site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/requirements.lock.txt

      - name: Install pinned Live dependencies
        run: python -m pip install -r automation/requirements.lock.txt

      - name: Check daily publication state
        id: due
        run: python automation/live_due.py

      - name: Generate Live candidate
        if: steps.due.outputs.due == 'true'
        run: python automation/run_live_update.py

      - name: Run local candidate health checks
        if: steps.due.outputs.due == 'true'
        run: python automation/health_check.py --historical-url "$GITHUB_WORKSPACE/sorctracks_tool.html" --live-url "$GITHUB_WORKSPACE/sorctracks_live.html" --max-live-age-hours 48 --output automation/live-health.json

      - name: Publish accepted Live page
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name "SORC automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sorctracks_live.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Live output is unchanged"
            exit 0
          fi
          git commit -m "Automated SORCTracks Live update"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push was not fast-forwardable. Rebuilding from the latest main and retrying."
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              python automation/run_live_update.py
              python automation/health_check.py --historical-url "$GITHUB_WORKSPACE/sorctracks_tool.html" --live-url "$GITHUB_WORKSPACE/sorctracks_live.html" --max-live-age-hours 48 --output automation/live-health.json
              git add sorctracks_live.html
              git diff --cached --check
              if git diff --cached --quiet; then
                echo "Another run already published the same Live output"
                exit 0
              fi
              git commit -m "Automated SORCTracks Live update"
            fi
          done
          exit 1

      - name: Request configured GitHub Pages build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/request_pages_build.py

      - name: Verify exact deployed Live bytes
        run: python automation/verify_live_deployment.py --expected sorctracks_live.html

      - name: Verify hosted freshness when daily retry is skipped
        if: steps.due.outputs.due != 'true'
        run: python automation/health_check.py --max-live-age-hours 36

      - name: Report a failed daily update
        if: failure()
        run: echo "::error::Live update or exact deployment verification failed. Last successfully published data has been preserved; the public freshness monitor remains active."
