name: SORCTracks historical update

on:
  schedule:
    - cron: "47 3 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when the public month is already current"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build and validate without publishing to GitHub"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: sorc-publisher
  cancel-in-progress: false

env:
  BUNDLE_URL: https://github.com/Tunga0412/sorc-ca/releases/download/historical-bundle-2026-08-26/sorctracks_historical_bundle_20260901_patched.zip

jobs:
  update-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out current public site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/requirements.lock.txt

      - name: Install pinned historical dependencies
        run: python -m pip install -r automation/requirements.lock.txt

      - name: Download versioned historical input bundle
        run: |
          mkdir -p .historical_bundle
          curl --fail --location --retry 3 "$BUNDLE_URL" --output .historical_bundle.zip
          unzip -q .historical_bundle.zip -d .historical_bundle
          bundle_dir=$(dirname "$(find .historical_bundle -name config.sanitized.json -print -quit)")
          test -n "$bundle_dir"
          echo "BUNDLE_DIR=$bundle_dir" >> "$GITHUB_ENV"

      - name: Generate and publish accepted historical candidate
        id: publish
        run: python automation/run_historical_update.py --bundle-dir "$BUNDLE_DIR" --repo-root "$GITHUB_WORKSPACE" ${{ inputs.force == true && '--force' || '' }} ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Open or update failure issue
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api_root = f"https://api.github.com/repos/{repo}"
          title = "SORCTracks historical update failure"

          def api(method, path, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "SORC historical updater/1.0",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          issues = api("GET", "/issues?state=open&per_page=100")
          existing = next(
              (
                  issue
                  for issue in issues
                  if issue.get("title") == title and "pull_request" not in issue
              ),
              None,
          )
          body = (
              "The scheduled SORCTracks historical update failed.\n\n"
              f"Workflow: {os.environ['GITHUB_RUN_URL']}\n\n"
              "The previous accepted historical publication was retained. "
              "Review the failed run before changing the published file.\n"
          )
          if existing:
              api("PATCH", f"/issues/{existing['number']}", {"body": body})
          else:
              api("POST", "/issues", {"title": title, "body": body})
          PY

      - name: Close resolved failure issue
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api_root = f"https://api.github.com/repos/{repo}"
          title = "SORCTracks historical update failure"

          def api(method, path, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "SORC historical updater/1.0",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          issues = api("GET", "/issues?state=open&per_page=100")
          for issue in issues:
              if issue.get("title") == title and "pull_request" not in issue:
                  api("PATCH", f"/issues/{issue['number']}", {"state": "closed"})
          PY

      - name: Archive historical QA outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorctracks-historical-run-${{ github.run_number }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
          path: |
            .historical_cache/**/release_manifest.json
            .historical_cache/**/cross_layer_qa_failures.csv
            .historical_cache/**/cross_layer_qa_warnings.csv
            .historical_cache/**/latest_completed_month_review_*.csv
            .historical_cache/**/ed_zero_hour_in_window_release_blocking_review.csv
