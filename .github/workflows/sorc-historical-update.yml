name: SORCTracks historical update

on:
  schedule:
    - cron: "47 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sorc-publisher
  cancel-in-progress: false

env:
  BUNDLE_URL: https://github.com/Tunga0412/sorc-ca/releases/download/historical-bundle-2026-08-26/sorctracks_historical_bundle_20260826_133436.zip

jobs:
  update-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out current public site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/requirements.lock.txt

      - name: Install pinned historical dependencies
        run: python -m pip install -r automation/requirements.lock.txt

      - name: Download versioned historical input bundle
        run: |
          mkdir -p .historical_bundle
          curl --fail --location --retry 3 "$BUNDLE_URL" --output .historical_bundle.zip
          unzip -q .historical_bundle.zip -d .historical_bundle
          bundle_dir=$(dirname "$(find .historical_bundle -name config.sanitized.json -print -quit)")
          test -n "$bundle_dir"
          echo "BUNDLE_DIR=$bundle_dir" >> "$GITHUB_ENV"

      - name: Generate and publish accepted historical candidate
        run: python automation/run_historical_update.py --bundle-dir "$BUNDLE_DIR" --repo-root "$GITHUB_WORKSPACE"

      - name: Archive historical QA outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorctracks-historical-run-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            .historical_cache/**/release_manifest.json
            .historical_cache/**/cross_layer_qa_failures.csv
            .historical_cache/**/cross_layer_qa_warnings.csv
            .historical_cache/**/latest_completed_month_review_*.csv

