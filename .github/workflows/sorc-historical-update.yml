name: SORCTracks historical update


on:
  schedule:
    - cron: "47 3 1 * *"→ Runs at 03:47, on day 1 of the month

  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when the public month is already current"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build and validate without publishing to GitHub"
        required: false
        default: false
        type: boolean


permissions:
  contents: write
  issues: write


concurrency:
  group: sorc-publisher
  cancel-in-progress: false


env:
  BUNDLE_URL: https://github.com/Tunga0412/sorc-ca/releases/download/historical-bundle-2026-08-26/sorctracks_historical_bundle_20260901_patched.zip


jobs:
  update-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
